<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Starry Night</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        opacity: 0;
        transition: opacity 0.8s ease;
        background-color: #000;
        background-position: 45% 40%;
        background-size: cover;
        background-repeat: no-repeat;
      }
      #stage.ready {
        opacity: 1;
      }
      #credit {
        position: fixed;
        right: 12px;
        bottom: 8px;
        font: 11px/1.2 sans-serif;
        color: rgba(255, 255, 255, 0.45);
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="credit">Vincent van Gogh, The Starry Night (1889)</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
