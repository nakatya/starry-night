<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Starry Night</title>
    <meta name="description" content="ゴッホ「星月夜」(1889)の全体を映し、空のうねりだけがゆっくり流れ続ける背景サイト。" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Starry Night" />
    <meta property="og:description" content="ゴッホ「星月夜」(1889)の全体を映し、空のうねりだけがゆっくり流れ続ける背景サイト。" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101c4a'/%3E%3Ccircle cx='20' cy='13' r='7' fill='none' stroke='%23f2d35c' stroke-width='2'/%3E%3Ccircle cx='20' cy='13' r='3' fill='%23f2d35c'/%3E%3C/svg%3E"

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        display: block;
        opacity: 0;
        transition: opacity 0.8s ease;
        background-color: #000;
        background-position: center;
        background-size: contain;
        background-repeat: no-repeat;
      }
      #stage.ready {
        opacity: 1;
      }
      #credit {
        position: fixed;
        right: 12px;
        bottom: 8px;
        font: 11px/1.2 sans-serif;
        color: rgba(255, 255, 255, 0.45);
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="credit">Vincent van Gogh, The Starry Night (1889)</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
