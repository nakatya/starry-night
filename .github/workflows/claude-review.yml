# PR が作られる・更新されるたびに Claude がレビューする(コメントのみ。コードは変更しない)
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude が作った PR もレビューする(bot 起動のイベントは標準では拒否されるため)
          allowed_bots: "claude,claude[bot]"
          prompt: |
            リポジトリ ${{ github.repository }} の PR #${{ github.event.pull_request.number }} をレビューしてください。
            実装者とは別の目で、次の観点を見ること。
            1. 対応する Issue の受け入れ条件を満たしているか
            2. CLAUDE.md の規約(ロジックを src/logic/ に分離、テストの有無、依存追加の理由)
            3. バグ・パフォーマンス(毎フレームの無駄な生成など)
            4. docs/DESIGN.md の見た目の方針(絵を崩さない・動きはゆっくり・空だけが動く)から外れていないか
            5. 表示速度と端末対応(スマホで重くならないか、WebGL が使えないときに静止画で出るか、画面サイズが変わっても画面いっぱいに出るか)
            問題点は該当行にインラインコメントし、最後に全体のまとめを1件コメントする。
            人が実際に画面を見て確認すべき点(動きの速さ・自然さなど)があれば「人の確認が必要」として明記する。
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
